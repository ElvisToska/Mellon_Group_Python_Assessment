name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-pip-${{ hashFiles('app/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest locally
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          DB_NAME: tms_test
          DB_USER: tms_user
          DB_PASS: tms_password
          DB_HOST: localhost
          DB_PORT: "3306"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: pytest -q

  docker-compose-tests:
    name: Docker Compose tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=test_root_password
          DB_NAME=tms_test
          DB_USER=tms_user
          DB_PASS=tms_password
          DB_HOST=mysql
          DB_PORT=3306
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build test image
        run: docker compose --profile tests build tests

      - name: Run tests inside Docker Compose
        run: docker compose --profile tests run --rm tests

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop and clean Docker Compose resources
        if: always()
        run: docker compose --profile tests down -v --remove-orphans

